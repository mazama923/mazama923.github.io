name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - name: Set up Gleam
        uses: gleam-lang/setup-gleam@v1
        with:
          version: "1.19.2"

      - name: Download dependencies
        run: gleam deps download

      - name: Check formatting
        run: gleam format --check

      - name: Run tests
        run: gleam test

      - name: Validate content
        run: ./scripts/check-content.sh

      - name: Build site
        run: gleam run -m mazama_blog
