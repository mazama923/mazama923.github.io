name: Intégration continue

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Erlang et Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"

      - name: Analyser les secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger les dépendances
        run: gleam deps download

      - name: Vérifier le formatage
        run: gleam format --check

      - name: Exécuter les tests
        run: gleam test

      - name: Valider le contenu
        run: ./scripts/check-content.sh

      - name: Générer le site
        run: gleam run -m mazama_blog
