name: Déployer le site Blogatto sur Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - name: Configurer Gleam
        uses: gleam-lang/setup-gleam@v1
        with:
          version: "1.19.2"

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Analyser les secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger les dépendances
        run: gleam deps download

      - name: Vérifier le formatage
        run: gleam format --check

      - name: Exécuter les tests
        run: gleam test

      - name: Valider le contenu
        run: ./scripts/check-content.sh

      - name: Générer le site
        run: gleam run -m mazama_blog

      - name: Téléverser l’artéfact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
